<title>Nibrass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column "record sleeve" app — sticky header, content well, bottom tab bar like a music player. */
:root {
  --bg: #fbf5f2;
  --surface: #ffffff;
  --sunk: #f4e9e4;
  --ink: #241a1e;
  --muted: #7c6b71;
  --line: #ecdcd5;
  --accent: #d93a4a;
  --accent-ink: #ffffff;
  --groove: #1d7f73;
  --ok: #1f8f5c;
  --ko: #c8333a;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161114; --surface: #211a1e; --sunk: #2b2227; --ink: #f6eef1; --muted: #b3a2a9;
    --line: #3a2e34; --accent: #ff5a68; --accent-ink: #1b0f12; --groove: #4cc3b1; --ok: #45cf8c; --ko: #ff6b70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161114; --surface: #211a1e; --sunk: #2b2227; --ink: #f6eef1; --muted: #b3a2a9;
  --line: #3a2e34; --accent: #ff5a68; --accent-ink: #1b0f12; --groove: #4cc3b1; --ok: #45cf8c; --ko: #ff6b70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 1.3rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
code { font-size: .9em; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 1.25rem; color: var(--ink); text-decoration: none; }
.disc { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle, var(--bg) 0 3px, var(--accent) 3.5px 7px, var(--ink) 7.5px 100%); }
.pill { font-weight: 700; font-size: .9rem; padding: 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }

main.wrap { display: grid; gap: 16px; padding-block: 20px; }
.stack { display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.panel.sunk { background: var(--sunk); border-color: transparent; }
.lead { display: grid; gap: 10px; padding-block: 6px; }
.lead h1 em { font-style: normal; color: var(--accent); }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

button, .btn {
  font: inherit; font-weight: 600; border: none; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 12px;
  background: var(--accent); color: var(--accent-ink);
}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
button:disabled { opacity: .55; cursor: progress; }
.btn.alt, button.alt { background: var(--sunk); color: var(--ink); }
.btn.bare, button.bare { background: transparent; color: var(--accent); padding: 6px 8px; }
.btn.sm, button.sm { padding: 6px 11px; font-size: .875rem; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
textarea { min-height: 110px; resize: vertical; }
label { font-weight: 600; font-size: .9rem; }
.field { display: grid; gap: 4px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 8px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }

.tracks { display: grid; gap: 0; }
.track { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; }
.track:last-child { border-bottom: none; }
.sleeve { width: 48px; height: 48px; flex: none; border-radius: 8px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: #fff; font-size: 1.05rem; }
.sleeve.big { width: 96px; height: 96px; font-size: 2rem; border-radius: 14px; }
.track .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track .a { color: var(--muted); font-size: .875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.tag.hot { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.tag.cefr { background: color-mix(in srgb, var(--groove) 16%, transparent); color: var(--groove); }

.item { display: flex; gap: 8px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: none; }
.word { font-weight: 700; }
.lvl { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 4px; }
.lvl i { width: 7px; height: 7px; border-radius: 2px; background: var(--line); }
.lvl i.on { background: var(--groove); }
.quote { border-left: 3px solid var(--accent); padding-left: 10px; font-style: italic; }
details > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
ul { margin: 0; padding-left: 20px; }

.bar { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); transition: width .3s; }
.q { font-family: var(--display); font-size: 1.45rem; font-weight: 800; }
.options { display: grid; gap: 8px; }
.option { justify-content: flex-start; text-align: left; background: var(--sunk); color: var(--ink); }
.option.right { background: var(--ok); color: #fff; }
.option.wrong { background: var(--ko); color: #fff; }
.fb { padding: 12px; border-radius: 12px; display: grid; gap: 4px; }
.fb.right { background: color-mix(in srgb, var(--ok) 14%, transparent); }
.fb.wrong { background: color-mix(in srgb, var(--ko) 14%, transparent); }
.flash { min-height: 190px; display: grid; place-items: center; text-align: center; cursor: pointer; font-family: var(--display); font-size: 1.8rem; font-weight: 800; background: var(--sunk); border-radius: var(--r); padding: 16px; border: none; color: var(--ink); width: 100%; }
.flash small { display: block; font-family: var(--body); font-size: .95rem; font-weight: 400; color: var(--muted); }

.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; align-items: end; height: 64px; }
.days div { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 3px; }
.days div.zero { background: var(--line); }
.timeline { list-style: none; padding: 0; display: grid; }
.timeline li { padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 10px; }
.timeline time { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; flex: none; }
.empty { text-align: center; padding: 28px 10px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.spin { display: inline-block; width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .bar > div { transition: none; } }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
}
nav.tabs .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
nav.tabs a { display: grid; justify-items: center; gap: 2px; padding: 5px 0; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: .68rem; font-weight: 600; }
nav.tabs a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a.on { color: var(--accent); background: var(--sunk); }
#toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; opacity: 0; pointer-events: none; transition: .25s; z-index: 20; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#home"><span class="disc" aria-hidden="true"></span>Nibrass</a>
  <span class="pill" id="streak" title="Jours d'affilée">🔥 0 jour</span>
</div></header>

<main class="wrap" id="view" aria-live="polite">
  <div class="empty"><span class="spin"></span> Chargement de ta playlist…</div>
</main>

<nav class="tabs" aria-label="Rubriques"><div class="in">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
  <a href="#playlist" data-tab="playlist"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Playlist</a>
  <a href="#grammar" data-tab="grammar"><svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>Grammaire</a>
  <a href="#vocab" data-tab="vocab"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Vocabulaire</a>
  <a href="#quiz" data-tab="quiz"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Quiz</a>
  <a href="#journal" data-tab="journal"><svg viewBox="0 0 24 24"><path d="M5 3h12a2 2 0 0 1 2 2v16l-4-2-4 2-4-2-4 2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h6"/></svg>Journal</a>
</div></nav>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';
const view = document.getElementById('view');

// ================= Utilitaires =================
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = (n) => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (key, n) => { const [y, m, d] = key.split('-').map(Number); return dayKey(new Date(y, m - 1, d + n)); };
const today = () => dayKey();
const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hue = (s) => [...String(s)].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const sleeve = (s, big = false) => {
  const h = hue(s.artist + s.title);
  const initials = (s.artist || '?').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  return `<span class="sleeve${big ? ' big' : ''}" style="background:linear-gradient(135deg,hsl(${h} 62% 46%),hsl(${(h + 40) % 360} 58% 32%))" aria-hidden="true">${esc(initials)}</span>`;
};
const level = (n) => `<span class="lvl" title="Niveau ${n}/5">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
const spinner = (msg) => `<div class="empty"><span class="spin"></span>${esc(msg)}</div>`;
const appleLink = (s) => `https://music.apple.com/fr/search?term=${encodeURIComponent(s.title + ' ' + s.artist)}`;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800);
}
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch { toast('La lecture audio n’est pas disponible ici.'); }
}
function bindSay(root = view) { root.querySelectorAll('[data-say]').forEach((b) => (b.onclick = () => speak(b.dataset.say))); }
// Bouton en deux temps (les boîtes de confirmation ne s'affichent pas ici).
function twoStep(btn, label, action) {
  btn.onclick = () => {
    if (btn.dataset.armed) return action();
    btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = label;
    setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; }, 3000);
  };
}

// ================= Stockage =================
// Avec la base de l'artifact : chaque personne a son propre espace privé.
// Sinon : stockage local du navigateur.
const S = { songs: [], vocab: [], activity: [], days: {} };
let db = null, base = null, sample = null;
const queues = {};

function localSave() { try { localStorage.setItem('nibrass', JSON.stringify(S)); } catch {} }
function persist(coll, id, data) {
  if (!db) return localSave();
  const key = coll + '/' + id;
  queues[key] = (queues[key] || Promise.resolve()).then(() =>
    (data === null ? db.collection(`${base}/${coll}`).doc(id).delete() : db.collection(`${base}/${coll}`).doc(id).set(JSON.parse(JSON.stringify(data))))
  ).catch((e) => { console.error(e); toast('Enregistrement impossible : ' + (e.message || e.code)); });
}
const saveSong = (s) => persist('songs', s.id, s);
const saveWord = (w) => persist('vocab', w.id, w);
const saveDay = (k) => persist('days', k, S.days[k]);
function log(type, extra = {}) {
  const a = { id: uid(), date: today(), at: new Date().toISOString(), type, ...extra };
  S.activity.push(a); persist('activity', a.id, a); updateStreak();
}

async function loadStore() {
  const c = window.claude;
  if (c && c.use) {
    try {
      const [d, u] = await Promise.all([c.use('db'), c.use('user')]);
      const id = u && (await u.id());
      if (d && id) { db = d; base = `data/users/${id}/lib`; }
    } catch (e) { console.warn(e); }
    c.use('sample').then((s) => { sample = s; if (s) rerender(); }).catch(() => {});
  }
  if (db) {
    const get = (coll, q) => (q ? q(db.collection(`${base}/${coll}`)) : db.collection(`${base}/${coll}`)).get();
    const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('La base ne répond pas.')), 10000));
    try {
      const [songs, vocab, acts, days] = await Promise.race([Promise.all([
        get('songs'), get('vocab'), get('activity', (c) => c.orderBy('at', 'desc').limit(800)), get('days'),
      ]), timeout]);
      S.songs = songs.docs.map((d) => d.data());
      S.vocab = vocab.docs.map((d) => d.data());
      S.activity = acts.docs.map((d) => d.data()).reverse();
      days.docs.forEach((d) => (S.days[d.id] = d.data()));
      return;
    } catch (e) {
      console.error(e); db = null;
      toast('Base indisponible : tes données restent dans ce navigateur.');
    }
  }
  try { Object.assign(S, JSON.parse(localStorage.getItem('nibrass') || '{}')); } catch {}
}

// ================= Apprentissage =================
const BOX = [0, 1, 2, 4, 8, 16];
function review(w, correct) {
  w.box = correct ? Math.min((w.box || 1) + 1, 5) : 1;
  w.nextReview = addDays(today(), BOX[w.box]);
  w.reviews = (w.reviews || 0) + 1;
  saveWord(w);
}
const isDue = (w) => !w.nextReview || w.nextReview <= today();
function streak() {
  const days = new Set(S.activity.map((a) => a.date));
  let k = days.has(today()) ? today() : addDays(today(), -1), n = 0;
  while (days.has(k)) { n++; k = addDays(k, -1); }
  return n;
}
function updateStreak() { const n = streak(); document.getElementById('streak').textContent = `🔥 ${n} jour${n > 1 ? 's' : ''}`; }
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, "'").replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
const isRight = (q, given) => !!norm(given) && [q.answer, ...(q.accepted_answers || [])].map(norm).includes(norm(given));

function quizWords(max) {
  const t = today();
  const acts = S.activity.filter((a) => a.date === t);
  const ids = new Set(acts.map((a) => a.vocabId).filter(Boolean));
  const songs = new Set(acts.map((a) => a.songId).filter(Boolean));
  const first = S.vocab.filter((w) => ids.has(w.id) || songs.has(w.songId));
  const due = S.vocab.filter((w) => !first.includes(w) && isDue(w));
  const rest = S.vocab.filter((w) => !first.includes(w) && !due.includes(w));
  return [...shuffle(first), ...shuffle(due), ...shuffle(rest)].slice(0, max);
}

function localQuiz() {
  const words = quizWords(10);
  if (!words.length) return null;
  const re = (w) => new RegExp(`\\b${w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'i');
  return {
    intro_fr: 'Ton quiz du jour, construit avec les mots que tu as rencontrés.',
    source: 'local',
    questions: words.map((w, i) => {
      const others = shuffle(S.vocab.filter((o) => o.id !== w.id)).slice(0, 3);
      if (i % 3 === 2 && w.example && re(w).test(w.example)) return { type: 'fill', prompt_fr: `Complète la phrase (indice : « ${w.translation} »)`, question: w.example.replace(re(w), '_____'), options: [], answer: w.word, accepted_answers: [], explanation_fr: w.note || '', vocab_word: w.word };
      if (i % 3 === 1 || others.length < 3) return { type: 'translate', prompt_fr: 'Traduis en anglais', question: w.translation, options: [], answer: w.word, accepted_answers: [], explanation_fr: w.example ? 'Exemple : ' + w.example : '', vocab_word: w.word };
      return { type: 'mcq', prompt_fr: 'Que signifie ce mot ?', question: w.word, options: shuffle([w.translation, ...others.map((o) => o.translation)]), answer: w.translation, accepted_answers: [], explanation_fr: w.example ? 'Exemple : ' + w.example : '', vocab_word: w.word };
    }),
  };
}

// ================= IA (Claude) =================
const LESSON_PROMPT = (s, lyrics) => `Tu es un professeur d'anglais chaleureux pour un francophone qui apprend l'anglais grâce aux chansons qu'il aime.
Chanson : "${s.title}" de ${s.artist}.
${lyrics ? `Paroles fournies par l'élève (pour ton analyse seulement, ne les recopie pas) :\n<lyrics>\n${lyrics}\n</lyrics>\n` : ''}
Crée une leçon. Réponds uniquement avec un objet JSON de cette forme :
{
 "known_song": true|false,
 "level": "A1"|"A2"|"B1"|"B2"|"C1"|"C2",
 "interpretation_fr": "sens de la chanson, histoire, émotions, contexte (4 à 8 phrases)",
 "themes": ["2 à 4 thèmes courts"],
 "mood": "ambiance en quelques mots",
 "grammar": [ { "topic": "nom du point (ex. Present perfect)", "rule_fr": "règle simple", "song_example": "court extrait de la chanson", "explanation_fr": "comment la règle s'applique à l'extrait", "more_examples": ["2 ou 3 phrases originales"], "exercise_question": "mini exercice", "exercise_answer": "réponse" } ],
 "vocabulary": [ { "word": "mot ou expression", "translation": "traduction française", "type": "nom|verbe|adjectif|expression…", "example": "phrase d'exemple courte", "note": "registre, piège ou prononciation" } ],

 "fun_fact_fr": "une anecdote sur la chanson ou l'artiste"
}
3 à 5 points de grammaire réellement illustrés par la chanson, 8 à 15 mots de vocabulaire utiles.

Si tu ne connais pas la chanson et qu'aucune parole n'est fournie, mets known_song à false, base la leçon sur le titre, l'artiste et ses thèmes habituels sans inventer de paroles, et dis-le dans interpretation_fr.`;

const QUIZ_PROMPT = (ctx) => `Tu es un professeur d'anglais qui prépare le quiz quotidien d'un élève francophone.
Voici ce que l'élève a fait aujourd'hui et ce qu'il doit réviser :
${JSON.stringify(ctx, null, 1)}

Types : "mcq" (4 options, answer est exactement l'une d'elles), "fill" (phrase anglaise avec "_____", options vide), "translate" (français ↔ anglais, options vide, variantes acceptables dans accepted_answers).
Si l'élève a écrit un journal en anglais, ajoute une question sur une erreur qu'il y a faite (s'il y en a).

const arr = (x) => (Array.isArray(x) ? x : []);
function cleanLesson(L) {
  return {
    known_song: L.known_song !== false,
    level: String(L.level || 'B1'),
    interpretation_fr: String(L.interpretation_fr || ''),
    themes: arr(L.themes).map(String).slice(0, 5),
    mood: String(L.mood || ''),
    grammar: arr(L.grammar).filter((g) => g && g.topic).map((g) => ({ topic: String(g.topic), rule_fr: String(g.rule_fr || ''), song_example: String(g.song_example || ''), explanation_fr: String(g.explanation_fr || ''), more_examples: arr(g.more_examples).map(String), exercise_question: String(g.exercise_question || ''), exercise_answer: String(g.exercise_answer || '') })),
    vocabulary: arr(L.vocabulary).filter((v) => v && v.word && v.translation).map((v) => ({ word: String(v.word), translation: String(v.translation), type: String(v.type || ''), example: String(v.example || ''), note: String(v.note || '') })),
    expressions: arr(L.expressions).filter((x) => x && x.expression).map((x) => ({ expression: String(x.expression), meaning_fr: String(x.meaning_fr || ''), usage_fr: String(x.usage_fr || '') })),
    pronunciation_tip_fr: String(L.pronunciation_tip_fr || ''),
    fun_fact_fr: String(L.fun_fact_fr || ''),
    createdAt: new Date().toISOString(),
  };
}
function cleanQuiz(Q) {
  const qs = arr(Q.questions).filter((q) => q && q.question && q.answer).map((q) => ({
    type: ['mcq', 'fill', 'translate'].includes(q.type) ? q.type : 'translate',
    prompt_fr: String(q.prompt_fr || ''), question: String(q.question), options: arr(q.options).map(String),
    answer: String(q.answer), accepted_answers: arr(q.accepted_answers).map(String),
    explanation_fr: String(q.explanation_fr || ''), vocab_word: String(q.vocab_word || ''),
  }));
  if (!qs.length) throw new Error('Le quiz reçu est vide.');
  return { intro_fr: String(Q.intro_fr || ''), questions: qs, source: 'ai' };
}
function aiError(e) {
  if (e && e.code === 'not_granted') return 'Autorise Claude pour cette page afin de créer les leçons.';
  if (e && e.code === 'rate_limited') return 'Trop de demandes d’un coup. Réessaie dans une minute.';

function addSongs(items, playlist = '') {
  let n = 0;
  for (const it of items) {
    const title = String(it.title || '').trim(), artist = String(it.artist || '').trim();
    if (!title || !artist) continue;
    if (S.songs.some((s) => s.title.toLowerCase() === title.toLowerCase() && s.artist.toLowerCase() === artist.toLowerCase())) continue;
    const s = { id: uid(), title, artist, album: it.album || '', playlist, addedAt: new Date().toISOString(), lesson: null };
    S.songs.push(s); saveSong(s); n++;
  }
  if (n) log('songs_added', { count: n });
  return n;
}
function parseList(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line) continue;
    if (line.includes('\t')) {
      const p = line.split('\t').map((x) => x.trim()).filter((x) => x && !/^\d{1,2}:\d{2}(:\d{2})?$/.test(x) && !/^\d+$/.test(x));
      if (p.length >= 2) out.push({ title: p[0], artist: p[1], album: p[2] || '' });
      continue;
    }
    const m = line.match(/^(.+?)\s+[-–—]\s+(.+)$/);
    if (m) out.push({ title: m[1].trim(), artist: m[2].trim() });
  }
  return out;
}

  draw();
  document.getElementById('addWord').onsubmit = (e) => {
    e.preventDefault();
    const w = { id: uid(), word: document.getElementById('nw').value.trim(), translation: document.getElementById('nt').value.trim(), example: document.getElementById('ne').value.trim(), note: '', type: '', songId: '', songTitle: '', box: 1, nextReview: today(), addedAt: new Date().toISOString() };
    S.vocab.push(w); saveWord(w); log('word_added', { vocabId: w.id, word: w.word });
    toast('Mot ajouté'); renderVocab();
  };
  document.getElementById('flashBtn').onclick = () => flashcards(shuffle(due));
}
function flashcards(queue) {
  const zone = document.getElementById('flash');
  let i = 0, flipped = false, good = 0;
  const show = () => {
    if (i >= queue.length) { zone.innerHTML = `<div class="empty"><h3>Bravo !</h3><p>${good}/${queue.length} mots retenus.</p></div>`; return; }
    const w = queue[i];
    zone.innerHTML = `<div class="stack"><div class="bar"><div style="width:${(i / queue.length) * 100}%"></div></div>
      <button class="flash" id="card">${flipped ? `<span>${esc(w.translation)}<small>${esc(w.example || '')}</small></span>` : `<span>${esc(w.word)}<small>Touche pour voir la traduction</small></span>`}</button>
      ${flipped ? `<div class="row" style="justify-content:center"><button class="alt" id="ko">Pas encore</button><button id="ok">Je savais</button></div>` : ''}</div>`;
    document.getElementById('card').onclick = () => { if (!flipped) speak(w.word); flipped = !flipped; show(); };
    const answer = (c) => { review(w, c); log('review', { vocabId: w.id, word: w.word, correct: c }); if (c) good++; i++; flipped = false; show(); };
    document.getElementById('ok')?.addEventListener('click', () => answer(true));
    document.getElementById('ko')?.addEventListener('click', () => answer(false));
  };
  show();
}

// ================= Quiz du jour =================
async function buildQuiz() {
  const t = today();
  const acts = S.activity.filter((a) => a.date === t);
  const words = quizWords(15);
  const ids = new Set(acts.map((a) => a.songId).filter(Boolean));
  const grammar = S.songs.filter((s) => s.lesson).slice(-4).flatMap((s) => s.lesson.grammar.map((g) => ({ topic: g.topic, rule_fr: g.rule_fr, song: s.title })));
  const journal = S.days[t]?.journal || '';
  if (sample && (words.length || grammar.length || journal)) {
    const ctx = {
      date: t,
      today_songs: S.songs.filter((s) => ids.has(s.id)).map((s) => ({ title: s.title, artist: s.artist })),
      today_activity: acts.map((a) => ({ type: a.type, title: a.title, word: a.word })),
      journal_of_the_day: journal,
      words_to_practice: words.map((w) => ({ word: w.word, translation: w.translation, example: w.example, from_song: w.songTitle })),
      recent_grammar: grammar.slice(0, 8),
      recent_mistakes: S.activity.filter((a) => a.type === 'quiz_answer' && !a.correct).slice(-8).map((a) => ({ question: a.question, expected: a.answer, given: a.given })),
    };
    return cleanQuiz(await sample.json(QUIZ_PROMPT(ctx), { modelTier: 'default', cache: false }));
  }
  return localQuiz();
}
async function renderQuiz(force = false) {
  const t = today();
  let day = S.days[t] ||= {};
  if (!day.quiz || force) {
    if (!S.vocab.length && !S.songs.some((s) => s.lesson) && !day.journal) {
      view.innerHTML = `<section class="lead"><span class="eyebrow">Quiz du jour</span><h1>Rien à réviser pour l'instant</h1></section>
        <div class="panel empty"><p>Ton quiz se construit avec ce que tu fais dans la journée.</p><p class="small">Étudie une chanson ou écris ton journal pour le débloquer.</p><a class="btn" href="#playlist">Étudier une chanson</a></div>`;
      return;
    }
    view.innerHTML = spinner('Je prépare ton quiz à partir de ta journée…');
    try {
      const q = await buildQuiz();
      if (!q) throw new Error('Pas encore assez de mots pour un quiz.');
      day.quiz = { ...q, createdAt: new Date().toISOString(), answers: q.questions.map(() => null), score: 0 };
      saveDay(t);
    } catch (e) {
      if (current !== 'quiz') return;
      const fallback = localQuiz();
      if (fallback) { day.quiz = { ...fallback, createdAt: new Date().toISOString(), answers: fallback.questions.map(() => null), score: 0 }; saveDay(t); toast(aiError(e) + ' Quiz simple à la place.'); }
      else { view.innerHTML = `<div class="panel"><p>${esc(aiError(e))}</p><div><button id="retry">Réessayer</button></div></div>`; document.getElementById('retry').onclick = () => renderQuiz(true); return; }
    }
    if (current !== 'quiz') return;
  }
  const quiz = day.quiz;
  const drawQ = () => {
    const i = quiz.answers.findIndex((a) => !a);
    if (i === -1) return drawEnd();
    const q = quiz.questions[i];
    const choice = q.type === 'mcq' && q.options.length >= 2;
    view.innerHTML = `<section class="lead"><span class="eyebrow">Quiz du jour · question ${i + 1} sur ${quiz.questions.length}</span>${quiz.intro_fr ? `<p class="muted">${esc(quiz.intro_fr)}</p>` : ''}</section>
      <section class="panel">
        <div class="bar"><div style="width:${(i / quiz.questions.length) * 100}%"></div></div>
        <div class="row spread small muted"><span>${esc(q.prompt_fr)}</span><span>Score ${quiz.score}</span></div>
        <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="q grow">${esc(q.question)}</div><button class="bare sm" id="say" aria-label="Écouter">🔊</button></div>
        ${choice ? `<div class="options">${q.options.map((o, k) => `<button class="option" data-o="${k}">${esc(o)}</button>`).join('')}</div>`
          : `<form id="free" class="row"><input id="ans" class="grow" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ta réponse" aria-label="Ta réponse"><button>Valider</button></form>`}
        <div id="fb"></div>
      </section>`;
    document.getElementById('say').onclick = () => speak(q.question.replace(/_+/g, 'blank'));
    const submit = (given, btn) => {
      const ok = isRight(q, given);
      quiz.answers[i] = { given, correct: ok };
      quiz.score = quiz.answers.filter((a) => a && a.correct).length;
      if (q.vocab_word) { const w = S.vocab.find((x) => x.word.toLowerCase() === q.vocab_word.toLowerCase()); if (w) review(w, ok); }
      log('quiz_answer', { correct: ok, question: q.question, answer: q.answer, given });
      if (quiz.answers.every(Boolean)) log('quiz_done', { score: quiz.score, total: quiz.questions.length });
      saveDay(t);
      view.querySelectorAll('.option').forEach((b) => { b.disabled = true; if (q.options[b.dataset.o] === q.answer) b.classList.add('right'); });
      if (btn && !ok) btn.classList.add('wrong');
      document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'right' : 'wrong'}"><b>${ok ? 'Bravo !' : 'Pas tout à fait.'}</b>${ok ? '' : `<span>Réponse : <b>${esc(q.answer)}</b></span>`}${q.explanation_fr ? `<span class="small">${esc(q.explanation_fr)}</span>` : ''}</div>
        <div style="margin-top:10px"><button id="next">Continuer</button></div>`;
      document.getElementById('next').onclick = drawQ;
      document.getElementById('next').focus();
    };
    view.querySelectorAll('[data-o]').forEach((b) => (b.onclick = () => submit(q.options[b.dataset.o], b)));
    const f = document.getElementById('free');
    if (f) { f.onsubmit = (e) => { e.preventDefault(); f.querySelector('button').disabled = true; document.getElementById('ans').disabled = true; submit(document.getElementById('ans').value); }; document.getElementById('ans').focus(); }
  };
  const drawEnd = () => {
    const n = quiz.questions.length, pct = Math.round((quiz.score / n) * 100);
    view.innerHTML = `<section class="lead"><span class="eyebrow">Quiz du jour · terminé</span><h1>${quiz.score}/${n} · ${pct >= 80 ? 'Excellent !' : pct >= 50 ? 'Bien joué !' : 'Continue comme ça !'}</h1><p class="muted">Reviens demain pour un nouveau quiz construit sur ta journée.</p></section>
      <section class="panel"><span class="eyebrow">Récapitulatif</span><div>${quiz.questions.map((q, k) => `<div class="item"><span>${quiz.answers[k]?.correct ? '✅' : '❌'}</span><div class="grow"><b>${esc(q.question)}</b>
        <div class="small">Réponse : ${esc(q.answer)}${quiz.answers[k]?.correct ? '' : ` · toi : ${esc(quiz.answers[k]?.given || '—')}`}</div>${q.explanation_fr ? `<div class="small muted">${esc(q.explanation_fr)}</div>` : ''}</div></div>`).join('')}</div></section>
      <div class="row"><a class="btn alt" href="#journal">Écrire mon journal</a><button class="bare" id="regen">Générer un nouveau quiz</button></div>`;
    twoStep(document.getElementById('regen'), 'Remplacer le quiz du jour ?', () => renderQuiz(true));
  };
  drawQ();
}

// ================= Journal =================
const LABELS = {
  songs_added: (a) => `${a.count} chanson(s) ajoutée(s) à la playlist`,
  listen: (a) => `Écouté « ${a.title} » de ${a.artist}`,
  lesson: (a) => `Leçon sur « ${a.title} » (+${a.newWords} mots)`,
  review: (a) => `${a.correct ? 'Su' : 'Revu'} : ${a.word}`,
  word_added: (a) => `Mot ajouté : ${a.word}`,
  quiz_answer: (a) => `${a.correct ? '✅' : '❌'} Quiz : ${a.question}`,
  quiz_done: (a) => `Quiz terminé : ${a.score}/${a.total}`,
  journal: () => 'Journal écrit',
};
function renderJournal() {
  const t = today();
  const acts = S.activity.filter((a) => a.date === t).reverse();
  view.innerHTML = `<section class="lead"><span class="eyebrow">Journal</span><h1>Ta journée en anglais</h1><p class="muted">Quelques phrases suffisent. Ton quiz s'en servira pour corriger tes erreurs.</p></section>
    <section class="panel"><label for="jtext">Aujourd'hui…</label><textarea id="jtext" placeholder="Today I listened to… I learned the word…">${esc(S.days[t]?.journal || '')}</textarea><div><button id="save">Enregistrer</button></div></section>
    <section class="panel"><h3>Ce que tu as fait aujourd'hui</h3>
      ${acts.length ? `<ul class="timeline">${acts.map((a) => `<li><time>${new Date(a.at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</time><span>${esc((LABELS[a.type] || (() => a.type))(a))}</span></li>`).join('')}</ul>` : '<p class="muted">Rien pour l’instant. Étudie une chanson pour commencer.</p>'}</section>`;
  document.getElementById('save').onclick = () => {
    const text = document.getElementById('jtext').value;
    const day = (S.days[t] ||= {});
    const first = !day.journal && text.trim();
    day.journal = text; saveDay(t);
    if (first) log('journal');
    toast('Journal enregistré');
  };
}

// ================= Démarrage =================
loadStore().finally(() => { updateStreak(); route(); });
})();
</script>
